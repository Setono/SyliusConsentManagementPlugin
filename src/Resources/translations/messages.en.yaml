                <p>
                    When a user visits your store, the plugin will query the database to see if there is a matching pair with
                    the channel (e.g. <strong>%channel%</strong>) and the locale (e.g. <strong>%locale%</strong>).
                </p>
                <p>
                    If there is a match, the widget configuration for that pair will be used to display the texts etc. in the consent widget.
