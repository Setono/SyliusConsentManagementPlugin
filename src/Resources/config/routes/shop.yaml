setono_sylius_consent_management_shop_consent_update:
    path: /consent
    methods: [GET, POST]
    defaults:
        _controller: setono_sylius_consent_management.controller.action.consent_widget
        _sylius:
            template: '@SetonoSyliusConsentManagementPlugin/shop/update.html.twig'
            redirect:
                route: 'sylius_shop_homepage'

setono_sylius_consent_management_shop_ajax_consent_widget:
    path: /ajax/consent-widget
    methods: POST
    defaults:
        _controller: setono_sylius_consent_management.controller.action.consent_widget

setono_sylius_consent_management_shop_partial_consent_widget:
    path: /_partial/consent-widget
    methods: GET
    defaults:
        _controller: setono_sylius_consent_management.controller.action.consent_widget
